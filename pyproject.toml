[project]
name = "harness"
version = "0.0.1"
description = "Harness de agente em REPL Python, com sandbox isolado e política no host."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "openai>=3.57.0",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "mypy",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testes reais (gastam tokens do OpenRouter) ficam fora da rodada padrão: use -m real_api.
addopts = "-m 'not real_api'"
markers = [
    "docker: testes que exigem o Docker e constroem a imagem do sandbox (pulados sem Docker)",
    "real_api: chamada real ao OpenRouter, com custo; excluída por padrão (rode com -m real_api)",
]

[[tool.mypy.overrides]]
# O SDK do Docker não traz tipos (sem py.typed); tratamos o módulo como Any.
module = ["docker", "docker.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# O openpyxl não traz tipos (sem py.typed); usado só em harness/evals e nos testes de avaliação.
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
